<style>

  #panel h1 { font-size: 22px; margin: 0 0 14px; color: var(--gold); text-shadow: 3px 3px 0 #000; }
  #panel p { font-size: 11px; margin: 6px 0; }
  #mute { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; font: inherit; font-size: 16px; color: #fff;
          background: var(--panel); border: 3px solid #fff; cursor: pointer; z-index: 5; }

  <div id="score">0</div>
  <div id="panel"><h1 id="title">FLAPPY NYAN</h1><p id="line1">Tap / click / Space</p><p id="line2">to fly</p></div>
  <button id="mute" title="Sound (M)">♪</button>
</div>

<script>
  // ---------- Settings (change these!) ----------
  const GRAVITY = 1500;   // how fast the cat falls
  const FLAP    = 470;    // how strong each tap is
  const GAP     = 175;    // height of the gap between pipes
  const SPEED   = 175;    // how fast pipes move
  const VOLUME  = 0.6;    // 0 to 1

  const W = 420, H = 640, CAT_X = 100, CAT_W = 72, CAT_H = 59, PW = 70, CAP = 26;
  const $ = id => document.getElementById(id);
  const cv = $('c'), g = cv.getContext('2d'), catEl = $('cat');
  const RAINBOW = ['#ff0000', '#ff9900', '#ffff00', '#33ff00', '#0099ff', '#6633ff'];

  // ---------- Fit the game to any screen ----------
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    $('wrap').style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ---------- Sound (made with code; optional mp3 files override it) ----------
  let ac, muted = false, musicTimer = null, step = 0;
  const SAMPLES = {};
  ['jump', 'score', 'hit', 'music'].forEach(n => {
    const el = new Audio(); const o = { el, ok: false };
    el.addEventListener('canplaythrough', () => { o.ok = true; });
    el.src = n + '.mp3'; SAMPLES[n] = o;
  });
  function initAudio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); }
  function tone(f, dur, type = 'square', vol = 0.2, to = null, delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    gn.gain.setValueAtTime(vol * VOLUME, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = 900;
    gn.gain.setValueAtTime(vol * VOLUME, ac.currentTime); gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    s.connect(f).connect(gn).connect(ac.destination); s.start();
  }
  const SYNTH = {
    jump:  () => tone(500, 0.1, 'square', 0.18, 950),
    score: () => { tone(880, 0.08, 'square', 0.18); tone(1320, 0.14, 'square', 0.18, null, 0.08); },
    hit:   () => { noise(0.35, 0.5); tone(220, 0.45, 'sawtooth', 0.25, 50); }
  };
  function sfx(name) {
    if (muted || !ac) return;
    const s = SAMPLES[name];
    if (s.ok) { s.el.volume = VOLUME; s.el.currentTime = 0; s.el.play().catch(SYNTH[name]); }
    else SYNTH[name]();
  }
  const MELODY = [523, 659, 784, 659, 880, 784, 659, 523, 587, 740, 880, 740, 988, 880, 740, 587];
  const BASS   = [131, 110, 147, 123];
  function startMusic() {
    if (muted || !ac) return;
    if (SAMPLES.music.ok) { SAMPLES.music.el.loop = true; SAMPLES.music.el.volume = VOLUME * 0.6; SAMPLES.music.el.play().catch(() => {}); return; }
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      tone(MELODY[step % 16], 0.14, 'square', 0.05);
      if (step % 4 === 0) tone(BASS[(step / 4) % 4], 0.5, 'triangle', 0.12);
      step++;
    }, 170);
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = null; SAMPLES.music.el.pause(); }
  function toggleMute() { muted = !muted; $('mute').textContent = muted ? '✕' : '♪'; muted ? stopMusic() : (state === 'play' && startMusic()); }
  $('mute').addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); toggleMute(); });

  // ---------- Game state ----------
  let state = 'ready', score = 0, best = 0, t = 0, deadAt = 0, flash = 0;
  const cat = { y: H / 2 - 30, vy: 0 };
  let pipes = [], hist = [];
  try { best = +localStorage.getItem('flappyNyanBest') || 0; } catch (e) {}
  const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 0.9, p: Math.random() * 6 }));

  function reset() { cat.y = H / 2 - 30; cat.vy = 0; pipes = []; hist = []; score = 0; state = 'ready'; showPanel('FLAPPY NYAN', 'Tap / click / Space', 'to fly'); }
  function showPanel(a, b, c) { $('title').textContent = a; $('line1').textContent = b; $('line2').textContent = c; $('panel').classList.remove('hidden'); }
  function die() {
    state = 'dead'; deadAt = performance.now(); flash = 1; sfx('hit'); stopMusic();
    if (score > best) { best = score; try { localStorage.setItem('flappyNyanBest', best); } catch (e) {} }
    showPanel('GAME OVER', 'Score ' + score + '  Best ' + best, 'Tap to retry');
  }
  function flap() {
    initAudio();
    if (state === 'ready') { state = 'play'; $('panel').classList.add('hidden'); startMusic(); }
    if (state === 'play') { cat.vy = -FLAP; sfx('jump'); }
    else if (state === 'dead' && performance.now() - deadAt > 500) reset();
  }
  $('wrap').addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) flap(); }
    if (e.code === 'KeyM') { initAudio(); toggleMute(); }
  });

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    stars.forEach(s => { s.x -= (state === 'dead' ? 0 : 30 * s.z) * dt; if (s.x < -4) { s.x = W + 4; s.y = Math.random() * H; } });
    if (state === 'ready') { cat.y = H / 2 - 30 + Math.sin(t * 3) * 8; }
    if (state === 'play') {
      cat.vy += GRAVITY * dt; cat.y += cat.vy * dt;
      if (cat.y < 0) { cat.y = 0; cat.vy = 0; }
      const last = pipes[pipes.length - 1];
      if (!last || last.x < W - 230) pipes.push({ x: W + 10, gapY: 110 + Math.random() * (H - 220 - GAP), passed: false });
      pipes.forEach(p => {
        p.x -= SPEED * dt;
        if (!p.passed && p.x + PW < CAT_X + 10) { p.passed = true; score++; sfx('score'); }
      });
      pipes = pipes.filter(p => p.x > -PW - 10);
      // hitbox is a bit smaller than the picture, so the game feels fair
      const bx = CAT_X + 12, by = cat.y + 12, bw = CAT_W - 24, bh = CAT_H - 22;
      if (by + bh > H) die();
      pipes.forEach(p => {
        if (bx + bw > p.x && bx < p.x + PW && (by < p.gapY || by + bh > p.gapY + GAP)) { if (state === 'play') die(); }
      });
    }
    if (state !== 'dead') { hist.unshift(cat.y); if (hist.length > 34) hist.pop(); }
    if (state === 'dead') cat.y = Math.min(cat.y + 0, H);
    flash = Math.max(0, flash - dt * 3);
    $('score').textContent = state === 'ready' ? '' : score;
  }

  // ---------- Draw ----------
  function draw() {
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0a1a4a'); bg.addColorStop(1, '#003366');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    stars.forEach(s => { g.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(t * 3 + s.p)})`; const z = Math.round(2 * s.z + 1); g.fillRect(Math.round(s.x), Math.round(s.y), z, z); });
    pipes.forEach(p => {
      const x = Math.round(p.x), gy = Math.round(p.gapY), by = gy + GAP;
      const body = (y, h) => { g.fillStyle = '#8e6bff'; g.fillRect(x, y, PW, h); g.fillStyle = '#b9a3ff'; g.fillRect(x + 8, y, 10, h); g.fillStyle = '#4b2fb5'; g.fillRect(x + PW - 10, y, 10, h); };
      const cap  = y => { g.fillStyle = '#2b1b6b'; g.fillRect(x - 6, y - 2, PW + 12, CAP + 4); g.fillStyle = '#8e6bff'; g.fillRect(x - 4, y, PW + 8, CAP); g.fillStyle = '#b9a3ff'; g.fillRect(x + 4, y, 10, CAP); g.fillStyle = '#4b2fb5'; g.fillRect(x + PW - 8, y, 12, CAP); };
      body(0, gy - CAP); cap(gy - CAP); cap(by); body(by + CAP, H);
    });
    // rainbow trail
    for (let i = 0; i < hist.length; i++) {
      const x = CAT_X + 16 - i * 7, wob = state === 'dead' ? 0 : Math.sin(i * 0.7 + t * 9) * 2;
      for (let k = 0; k < 6; k++) { g.fillStyle = RAINBOW[k]; g.fillRect(x, Math.round(hist[i] + 12 + k * 6 + wob), 8, 6); }
    }
    if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash * 0.8})`; g.fillRect(0, 0, W, H); }
    const rot = state === 'ready' ? 0 : Math.max(-0.45, Math.min(0.9, cat.vy / 650));
    catEl.style.transform = `translate(${CAT_X}px, ${cat.y}px) rotate(${rot}rad)`;
  }

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  })(last);
</script>
